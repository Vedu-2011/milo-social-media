name: weekly-report
on:
  schedule:
    - cron: "30 2 * * 1"   # Mondays 2:30 UTC = 8 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: pull insights
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 report.py
