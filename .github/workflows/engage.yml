name: engage-comments
on:
  schedule:
    - cron: "0 2,5,8,14,17,20,23 * * *"   # every ~3h through US evening + IST morning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: reply to FAQ comments
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 engage.py
