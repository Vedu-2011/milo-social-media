name: engage-comments
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, 24/7
  workflow_dispatch:

concurrency:
  group: engage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: reply to FAQ comments
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 engage.py
